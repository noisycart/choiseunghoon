  <style>
    :root {
      --bg: #f7f3ee;
      --paper: #fffdf9;
      --text: #25211d;
      --muted: #7b7168;
      --line: rgba(37,33,29,.14);
      --shadow: 0 18px 50px rgba(31, 25, 20, .10);
      --max: 1320px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR",
                   "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }
    body.no-scroll { overflow: hidden; }
    button { font: inherit; }

    .hero {
      min-height: 88svh;
      position: relative;
      display: grid;
      place-items: end center;
      overflow: hidden;
      background: #d8d1ca center/cover no-repeat;
      isolation: isolate;
    }
    .hero::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,.05) 20%,
        rgba(0,0,0,.12) 55%,
        rgba(0,0,0,.58) 100%);
      z-index: -1;
    }
    .hero-inner {
      width: min(100% - 36px, 1000px);
      color: white;
      text-align: center;
      padding: 72px 0 66px;
      text-shadow: 0 2px 18px rgba(0,0,0,.25);
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 12px;
      font-weight: 650;
      opacity: .88;
      margin-bottom: 14px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: clamp(42px, 8vw, 92px);
      line-height: .98;
      margin: 0;
      letter-spacing: -.035em;
    }
    .date {
      margin: 18px 0 0;
      font-size: 15px;
      letter-spacing: .08em;
      opacity: .92;
    }
    .hero-actions {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }
    .hero-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 122px;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: .015em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(255,255,255,.075);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }
    .hero-action-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.55;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: .92;
    }
    .hero-action-icon .icon-fill {
      fill: currentColor;
      stroke: none;
    }
    .hero-actions a:hover,
    .hero-actions a:focus-visible {
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.9);
      transform: translateY(-1px);
      outline: none;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto;
      padding: 86px 28px 56px;
      text-align: center;
    }
    .intro p {
      margin: 0;
    }
    .intro-title {
      display: block;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 3vw, 36px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.015em;
    }
    .intro-subtitle {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(15px, 1.6vw, 18px);
      font-weight: 400;
      line-height: 1.7;
      white-space: pre-line;
    }
    .rule {
      width: 48px;
      height: 1px;
      background: var(--line);
      margin: 30px auto 0;
    }

    #gallery,
    #highlightFilm,
    #fullFilm {
      scroll-margin-top: 24px;
    }

    .video-section {
      width: min(100% - 28px, 1100px);
      margin: 8px auto 76px;
      text-align: center;
    }
    .video-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .video-section h2 {
      margin: 0 0 26px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3vw, 39px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.02em;
    }
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 5px;
      background: #111;
      box-shadow: var(--shadow);
    }
    .video-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .gallery-wrap {
      width: min(100% - 28px, var(--max));
      margin: 0 auto;
      padding: 0 0 96px;
    }
    .gallery {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 12px;
    }
    .photo {
      margin: 0;
      border-radius: 3px;
      overflow: hidden;
      background: #eae4dd;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
      cursor: zoom-in;
      position: relative;
      flex: 0 0 auto;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .45s ease, filter .3s ease;
    }
    .photo:hover img { transform: scale(1.012); }
    .photo:focus-visible {
      outline: 3px solid rgba(37,33,29,.42);
      outline-offset: 3px;
    }

    .full-film-section {
      width: min(100% - 28px, 1100px);
      margin: 92px auto 100px;
      text-align: center;
    }
    .film-label {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .film-title {
      margin: 0;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 3vw, 39px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -.02em;
    }
    .film-desc {
      max-width: 700px;
      margin: 14px auto 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .full-film-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 5px;
      background: #111;
      box-shadow: var(--shadow);
    }
    .full-film-frame iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .chapter-heading {
      margin: 30px 0 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .chapter-links {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .chapter-link {
      appearance: none;
      -webkit-appearance: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.32);
      color: var(--text);
      min-height: 72px;
      padding: 11px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }
    .chapter-link:hover,
    .chapter-link:focus-visible {
      transform: translateY(-2px);
      background: rgba(255,255,255,.72);
      border-color: rgba(37,33,29,.26);
      outline: none;
    }
    .chapter-link.active {
      background: var(--text);
      color: var(--paper);
      border-color: var(--text);
    }
    .chapter-link.active .chapter-time {
      color: rgba(255,255,255,.72);
    }
    .chapter-time {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .08em;
    }
    .chapter-name {
      font-size: 13px;
      line-height: 1.35;
    }

    footer {
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      padding: 28px 20px 44px;
      font-size: 12px;
      letter-spacing: .08em;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(14,13,12,.94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 34px 62px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: calc(100svh - 68px);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lb-close, .lb-prev, .lb-next {
      position: fixed;
      border: 0;
      color: white;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
      cursor: pointer;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .lb-close { top: 16px; right: 16px; font-size: 22px; }
    .lb-prev { left: 14px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 14px; top: 50%; transform: translateY(-50%); }
    .lb-prev svg, .lb-next svg {
      width: 18px;
      height: 18px;
      display: block;
      flex: 0 0 auto;
      pointer-events: none;
    }
    .lb-prev svg path, .lb-next svg path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .lb-count {
      position: fixed;
      bottom: 16px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.78);
      font-size: 12px;
      letter-spacing: .08em;
      background: rgba(0,0,0,.22);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px 120px;
      color: var(--muted);
    }

    @media (max-width: 700px) {
      .hero { min-height: 74svh; }
      .hero-inner { padding-bottom: 46px; }
      .hero-actions {
        gap: 6px;
        margin-top: 24px;
        flex-wrap: nowrap;
      }
      .hero-actions a {
        min-width: 0;
        flex: 1 1 0;
        max-width: 132px;
        padding: 9px 8px;
        gap: 5px;
        font-size: 11.5px;
        white-space: nowrap;
      }
      .hero-action-icon {
        width: 14px;
        height: 14px;
        flex-basis: 14px;
      }
      .intro { padding-top: 62px; }
      .video-section {
        width: min(100% - 16px, 1100px);
        margin-top: 0;
        margin-bottom: 54px;
      }
      .video-section h2 {
        margin-bottom: 18px;
      }
      .gallery-wrap { width: min(100% - 16px, var(--max)); }
      .gallery { gap: 8px; }
      .lightbox { padding: 48px 8px; }
      .lb-prev, .lb-next {
        top: auto; bottom: 14px; transform: none;
      }
      .lb-prev { left: 14px; }
      .lb-next { right: 14px; }
      .lb-count { bottom: 21px; }

      .full-film-section {
        width: min(100% - 16px, 1100px);
        margin: 62px auto 72px;
      }
      .film-desc {
        font-size: 14px;
        margin-bottom: 22px;
      }
      .chapter-heading {
        margin-top: 24px;
      }
      .chapter-links {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
      }
      .chapter-link:last-child {
        grid-column: 1 / -1;
      }
    }
  
    /* Album usability improvements */
    #nl-badge-frame { display: none !important; }
    .hero-actions a { min-height:44px; background:rgba(0,0,0,.24); }
    .intro-subtitle, .film-desc { word-break:keep-all; }
    .gallery-wrap { padding-bottom:0; }
    .full-film-section { margin-top:72px; }
    #gallery, #highlightFilm, #fullFilm { scroll-margin-top:88px; }
    .gallery-title { text-align:center; font-size:20px; font-weight:500; margin:0 0 24px; }
    .gallery-title span { font:12px sans-serif; color:var(--muted); margin-left:8px; }
    .section-nav { position:fixed; z-index:30; top:12px; left:50%; transform:translateX(-50%); display:flex; width:max-content; max-width:calc(100% - 24px); padding:4px; gap:2px; border:1px solid var(--line); border-radius:30px; background:rgba(255,253,249,.96); box-shadow:0 4px 20px #25211d18; }
    .section-nav[hidden] { display:none; }
    .section-nav a { display:flex; align-items:center; justify-content:center; gap:5px; min-height:44px; padding:0 14px; color:var(--text); text-decoration:none; border-radius:24px; font-size:12px; white-space:nowrap; }
    .section-nav a[aria-current] { background:var(--text); color:var(--paper); }
    a:focus-visible, button:focus-visible, .hero-actions a:focus-visible, .chapter-link:focus-visible { outline:3px solid currentColor; outline-offset:4px; }
    .lightbox { margin:0; border:0; width:100%; height:100%; max-width:none; max-height:none; color:white; }
    .lightbox::backdrop { background:#0e0d0c; }
    .lb-close,.lb-prev,.lb-next { width:48px; height:48px; }
    .lb-status { position:fixed; top:76px; left:12px; right:12px; text-align:center; font-size:14px; }
    .lb-status button { margin-left:10px; min-height:44px; padding:0 14px; }
    footer p { margin:0 0 12px; letter-spacing:0; font-size:14px; }
    footer a, .film-fallback { color:var(--muted); text-underline-offset:4px; }
    footer a { display:inline-flex; align-items:center; min-height:44px; }
    .film-help { color:var(--muted); font-size:13px; line-height:1.7; margin:20px 12px 0; }
    @media(max-width:700px) {
      .hero-actions a { font-size:12px; }
      .full-film-section { margin-top:56px; }
      .section-nav a { padding:0 10px; }
    }
    @media(prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      *,*::before,*::after { transition:none !important; }
    }

  </style>
</head>
<body>
  <header class="hero" id="top">
    <div class="hero-inner">
      <div class="eyebrow">Wedding Album</div>
      <h1 id="coupleNames">Our Wedding</h1>
      <p class="date" id="weddingDate"></p>
      <nav class="hero-actions" aria-label="앨범 바로가기">
        <a href="#highlightFilm">
          <svg class="hero-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
            <path d="M10 9l5 3-5 3z" class="icon-fill"></path>
          </svg>
          <span>하이라이트</span>
        </a>

        <a href="#gallery">
          <svg class="hero-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
            <circle cx="9" cy="9" r="1.5" class="icon-fill"></circle>
            <path d="M5.5 17l4.5-4.5 3 3 2.5-2.5 3 4"></path>
          </svg>
          <span>사진</span>
        </a>

        <a href="#fullFilm">
          <svg class="hero-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect>
            <path d="M10 9l5 3-5 3z" class="icon-fill"></path>
          </svg>
          <span>풀 필름</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="intro">
    <p id="introText">함께한 하루의 장면들을 한곳에 담았습니다.</p>
    <div class="rule"></div>
  </section>

  <section class="video-section" id="highlightFilm" aria-labelledby="weddingFilmTitle">
    <div class="video-label">WEDDING HIGHLIGHT</div>
    <h2 id="weddingFilmTitle">99초로 보는 그날</h2>
    <div class="video-frame">
      <iframe
        id="highlightPlayer" src="https://www.youtube-nocookie.com/embed/vJl_sjXUn14?enablejsapi=1&amp;playsinline=1&amp;rel=0"
        title="최승훈 박경빈 Wedding Highlight"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <main class="gallery-wrap" id="gallery" aria-labelledby="galleryTitle">
    <h2 class="gallery-title" id="galleryTitle">그날의 사진 <span>71장</span></h2>
    <div class="gallery" id="galleryGrid"></div>
    <div class="empty" id="emptyState" hidden>표시할 사진이 없습니다.</div>
  </main>

  <section class="full-film-section" id="fullFilm" aria-labelledby="fullWeddingFilmTitle">
    <div class="film-label">FULL WEDDING FILM</div>
    <h2 class="film-title" id="fullWeddingFilmTitle">처음부터 끝까지</h2>
    <p class="film-desc">
      2026년 5월 25일, 그날의 장면과 목소리를 46분 32초에 담았습니다.
    </p>

    <div class="full-film-frame" id="fullFilmPlayerWrap">
      <iframe
        id="fullFilmPlayer"
        src="https://www.youtube-nocookie.com/embed/v8xYqdxrPFE?enablejsapi=1&amp;playsinline=1&amp;rel=0"
        title="최승훈 박경빈 Full Wedding Film"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <p class="film-help"><span id="filmStatus" role="status">아래 장면을 누르면 해당 시점으로 이동합니다.</span><br><a class="film-fallback" id="filmFallback" href="https://www.youtube.com/watch?v=v8xYqdxrPFE" target="_blank" rel="noopener">YouTube에서 보기 ↗</a></p>
    <div class="chapter-heading">SCENES</div>
    <div class="chapter-links" role="group" aria-label="전체 영상 주요 장면">
      <button class="chapter-link" type="button" data-start="1049">
        <span class="chapter-time">17:29</span>
        <span class="chapter-name">신랑 입장</span>
      </button>

      <button class="chapter-link" type="button" data-start="1253">
        <span class="chapter-time">20:53</span>
        <span class="chapter-name">신부 입장</span>
      </button>

      <button class="chapter-link" type="button" data-start="1405">
        <span class="chapter-time">23:25</span>
        <span class="chapter-name">혼인서약</span>
      </button>

      <button class="chapter-link" type="button" data-start="2450">
        <span class="chapter-time">40:50</span>
        <span class="chapter-name">신랑·신부 행진</span>
      </button>

      <button class="chapter-link" type="button" data-start="2561">
        <span class="chapter-time">42:41</span>
        <span class="chapter-name">기념촬영</span>
      </button>
    </div>
  </section>

  <nav class="section-nav" id="sectionNav" aria-label="섹션 이동" hidden></nav>
  <footer>
    <p>함께해 주신 모든 분께 감사합니다.</p>
    <a href="#top">맨 위로 ↑</a><br>
    <span id="footerText">WEDDING ALBUM</span>
  </footer>

  <dialog class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">

    const introLines = introRaw.split("\n");

    introEl.textContent = "";

    introTitle.textContent = introLines[0] || "";

    const introSubtitle = document.createElement("span");

    introSubtitle.textContent = introLines.slice(1).join("\n");

    introEl.appendChild(introTitle);
    if (introSubtitle.textContent.trim()) {
      introEl.appendChild(introSubtitle);
    }

    if (photos.length) {
      const heroPhoto = "images/full/photo_052.webp";
      $(".hero").style.backgroundImage = `url("${heroPhoto}")`;

      const frag = document.createDocumentFragment();
      photos.forEach((p, i) => {
        const item = document.createElement("div");
        item.className = "photo";
        item.tabIndex = 0;
        item.dataset.index = i;
        item.dataset.ratio = (p.width && p.height) ? (p.width / p.height) : 1.5;
        item.setAttribute("role", "button");
        item.setAttribute("aria-label", `${i + 1}번째 사진 크게 보기`);

        const img = document.createElement("img");
        img.src = p.thumb || p.full;
        img.alt = p.alt || "";
        img.loading = i < 8 ? "eager" : "lazy";
        img.decoding = "async";

        item.appendChild(img);
        item.addEventListener("click", () => openLightbox(i));
        item.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openLightbox(i);
          }
        });
        frag.appendChild(item);
      });
      $("#galleryGrid").appendChild(frag);

      requestAnimationFrame(layoutJustifiedGallery);
    } else {
      $("#emptyState").hidden = false;
    }

    function getGallerySettings() {
      const w = window.innerWidth;
      if (w <= 700) return { targetHeight: 185, gap: 8 };
      if (w <= 1050) return { targetHeight: 220, gap: 10 };
      return { targetHeight: 260, gap: 12 };
    }

    function layoutJustifiedGallery() {
      const gallery = $("#galleryGrid");
      if (!gallery || !photos.length) return;

      const items = [...gallery.children];
      const containerWidth = gallery.clientWidth;
      if (!containerWidth) return;

      const { targetHeight, gap } = getGallerySettings();
      gallery.style.gap = `${gap}px`;

      items.forEach(item => {
        item.style.width = "";
        item.style.height = "";
      });

      let row = [];
      let ratioSum = 0;

      function applyRow(rowItems, sum, isLast = false) {
        if (!rowItems.length) return;

        const gapsWidth = gap * (rowItems.length - 1);
        let rowHeight = (containerWidth - gapsWidth) / sum;

        // 마지막 행은 사진 수가 적을 때만 왼쪽 정렬한다.
        if (isLast && rowHeight > targetHeight * 1.18) {
          rowHeight = targetHeight;
        }

        rowItems.forEach(item => {
          const ratio = Number(item.dataset.ratio) || 1.5;
          item.style.width = `${ratio * rowHeight}px`;
          item.style.height = `${rowHeight}px`;
        });
      }

      items.forEach((item, idx) => {
        const ratio = Number(item.dataset.ratio) || 1.5;
        row.push(item);
        ratioSum += ratio;

        const projectedWidth =
          ratioSum * targetHeight + gap * (row.length - 1);

        const isLastItem = idx === items.length - 1;

        if (projectedWidth >= containerWidth && !isLastItem) {
          applyRow(row, ratioSum, false);
          row = [];
          ratioSum = 0;
        } else if (isLastItem) {
          applyRow(row, ratioSum, true);
        }
      });
    }

    let galleryResizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(galleryResizeTimer);
      galleryResizeTimer = setTimeout(layoutJustifiedGallery, 100);
    });

    const lightbox = $("#lightbox");
    const lbImage = $("#lbImage");
    const lbStatus = $("#lbStatus");
    const lbRetry = $("#lbRetry");
    let returnFocus = null;
    let imageRequest = 0;
    function showAt(i) {
      if (!photos.length) return;
      current = (i + photos.length) % photos.length;
      const p = photos[current], request = ++imageRequest;
      lbImage.style.visibility = "hidden";
      lbStatus.textContent = "사진을 불러오는 중입니다…";
      lbRetry.hidden = true;
      $("#lbCount").textContent = `${current + 1} / ${photos.length}`;
      const loader = new Image();
      loader.onload = () => {
        if (request !== imageRequest) return;
        lbImage.src = p.full;
        lbImage.alt = p.alt || `결혼식 사진 ${current + 1}, 전체 ${photos.length}장`;
        lbImage.style.visibility = "visible";
        lbStatus.textContent = "";
        [current - 1, current + 1].forEach(j => {
          const preload = new Image();
          preload.src = photos[(j + photos.length) % photos.length].full;
        });
      };
      loader.onerror = () => {
        if (request !== imageRequest) return;
        lbStatus.textContent = "사진을 불러오지 못했습니다.";
        lbRetry.hidden = false;
      };
      loader.src = p.full;
    }
    function openLightbox(i) {
      returnFocus = document.activeElement;
      showAt(i);
      lightbox.classList.add("open");
      lightbox.showModal();
      document.body.classList.add("no-scroll");
      $("#lbClose").focus();
    }
    function closeLightbox() { lightbox.close(); }
    lightbox.addEventListener("close", () => {
      ++imageRequest;
      lightbox.classList.remove("open");
      document.body.classList.remove("no-scroll");
      lbImage.removeAttribute("src");
      returnFocus?.focus({preventScroll:true});
    });
    $("#lbClose").addEventListener("click", closeLightbox);
    $("#lbPrev").addEventListener("click", () => showAt(current - 1));
    $("#lbNext").addEventListener("click", () => showAt(current + 1));
    lbRetry.addEventListener("click", () => showAt(current));
    lightbox.addEventListener("click", e => { if(e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener("keydown", e => {
      if(e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault(); showAt(current + (e.key === "ArrowRight" ? 1 : -1));
      }
      if(e.key === "Tab") {
        const buttons = [...lightbox.querySelectorAll("button")].filter(b => !b.hidden);
        const first = buttons[0], last = buttons[buttons.length - 1];
        if(e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    let touchStartY = null;
    lightbox.addEventListener("touchstart", e => {
      if(e.touches.length !== 1 || e.target.closest("button")) { touchStartX = null; return; }
      touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
    }, {passive:true});
    lightbox.addEventListener("touchend", e => {
      if(touchStartX === null) return;
      const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) showAt(current+(dx<0?1:-1));
      touchStartX=null;
    }, {passive:true});
    lightbox.addEventListener("touchcancel", () => {touchStartX=null;});

    const sectionNav = $("#sectionNav");
    sectionNav.innerHTML = $(".hero-actions").innerHTML;
    const sections = [$("#highlightFilm"), $("#gallery"), $("#fullFilm")];
    let scrollPending = false;
    function updateNav() {
      sectionNav.hidden = $(".hero").getBoundingClientRect().bottom > 0;
      let active = null;
      sections.forEach(section => { if(section.getBoundingClientRect().top <= innerHeight * .4) active=section.id; });
      [...sectionNav.querySelectorAll("a")].forEach(a => {
        if(a.hash === `#${active}`) a.setAttribute("aria-current","location");
        else a.removeAttribute("aria-current");
      });
      scrollPending=false;
    }
    addEventListener("scroll", () => {if(!scrollPending) {scrollPending=true; requestAnimationFrame(updateNav);}}, {passive:true});
    addEventListener("resize", updateNav);
    updateNav();

    const chapterButtons = [...document.querySelectorAll(".chapter-link")];
    const filmStatus = $("#filmStatus");
    const filmFallback = $("#filmFallback");
    let fullPlayer, highlightPlayer, fullReady=false, queuedStart=null, apiRequested=false, chapterTimer=null;
    function activeChapter(time) {
      let selected = null;
      chapterButtons.forEach(b => {if(time >= Number(b.dataset.start)) selected=b;});
      chapterButtons.forEach(b => {
        b.classList.toggle("active", b===selected);
        if(b===selected) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current");
      });
    }
    function jumpTo(start) {
      fullPlayer.seekTo(start, true);
      fullPlayer.playVideo();
      activeChapter(start);

      filmStatus.textContent="재생되지 않으면 영상의 재생 버튼을 눌러 주세요.";
    }
    window.onYouTubeIframeAPIReady = () => {
      highlightPlayer=new YT.Player("highlightPlayer", {events:{onStateChange:e=>{
        if(e.data===1 && fullReady) fullPlayer.pauseVideo();
      }}});
      fullPlayer=new YT.Player("fullFilmPlayer", {events:{
        onReady:()=>{fullReady=true; if(queuedStart!==null) {jumpTo(queuedStart); queuedStart=null;}},
        onStateChange:e=>{
          clearInterval(chapterTimer);
          if(e.data===1) {
            if(highlightPlayer && typeof highlightPlayer.pauseVideo === "function") highlightPlayer.pauseVideo();
            filmStatus.textContent="아래 장면을 누르면 해당 시점으로 이동합니다.";
            chapterTimer=setInterval(()=>activeChapter(fullPlayer.getCurrentTime()),500);
          }
          if(fullReady) activeChapter(fullPlayer.getCurrentTime());
        },
        onError:()=>{filmStatus.textContent="영상을 불러오지 못했습니다. YouTube에서 시청해 주세요.";},
        onAutoplayBlocked:()=>{filmStatus.textContent="영상의 재생 버튼을 눌러 이어서 시청해 주세요.";}
      }});
    };
    function loadPlayerAPI() {
      if(apiRequested) return;
      apiRequested=true;
      [$("#highlightPlayer"),$("#fullFilmPlayer")].forEach(frame=>{
        frame.loading="eager";
        const url=new URL(frame.src);
        if(location.protocol !== "file:") url.searchParams.set("origin",location.origin);
        frame.src=url.href;
      });
      const script=document.createElement("script");
      script.src="https://www.youtube.com/iframe_api";
      script.onerror=()=>{filmStatus.textContent="장면 이동을 연결하지 못했습니다. YouTube에서 보기 링크를 이용해 주세요.";};
      document.head.appendChild(script);
    }
    chapterButtons.forEach(button=>button.addEventListener("click",()=>{
      const start=Number(button.dataset.start);
      filmFallback.href=`https://www.youtube.com/watch?v=v8xYqdxrPFE&t=${start}s`;
      if(fullReady) jumpTo(start);
      else {
        queuedStart=start; loadPlayerAPI();
        filmStatus.textContent="장면을 준비하고 있습니다… 연결되지 않으면 YouTube에서 보기 링크를 눌러 주세요.";
      }
      if(matchMedia("(max-width:700px)").matches) {
        window.scrollTo({top:$("#fullFilmPlayerWrap").getBoundingClientRect().top+scrollY-82,
          behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"instant":"smooth"});
      }
    }));
    loadPlayerAPI();



  </script>
</body>
</html>
